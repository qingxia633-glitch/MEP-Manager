name: Check first version
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js
      - run: node --check cad.js
      - run: node --check cad-server.cjs
      - run: node --check snap.js
      - run: node --check management.js
      - run: npm test
